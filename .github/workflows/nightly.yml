name: Nightly

# Catches rot between cycles. A failure becomes an issue, so the agent
# finds it in the same place it finds everything else.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium for the component tests
        run: npx playwright install --with-deps chromium
      - name: Verify
        run: npm run verify
      - name: File issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: 'ci-failure', state: 'open' });
            if (open.data.length === 0) {
              await github.rest.issues.create({ ...context.repo,
                title: `Nightly verify failed — ${new Date().toISOString().slice(0,10)}`,
                labels: ['ci-failure'],
                body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
