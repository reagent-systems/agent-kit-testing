name: Bug
description: Something behaves differently from how it is documented.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: State what you saw. Paste the output if there is any.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Number the steps. A reader follows them in order.
      placeholder: |
        1. Run `npm run verify`
        2. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The tag, or the commit SHA you ran.
    validations:
      required: false
